name: Validar catálogo

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar catalog.json y plugins
        run: python3 scripts/validate_catalog.py
      - name: Validar install.sh
        run: bash -n install.sh
      - name: Compilar marketplace y guardián
        run: python3 -m py_compile marketplace.py guard/marketplace_guard.py
